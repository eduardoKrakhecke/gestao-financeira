
<header class="header">
  <div class="header__left">
    <button
      class="header__menu-button"
      type="button"
      aria-label="Abrir menu de navegação"
      (click)="openMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="header__heading">
      <span class="header__eyebrow">FINANCEFLOW</span>
      <h1>Gestão financeira</h1>
    </div>
  </div>

  <div class="header__actions">
    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="
        theme() === 'dark'
          ? 'Ativar tema claro'
          : 'Ativar tema escuro'
      "
      [attr.title]="
        theme() === 'dark'
          ? 'Ativar tema claro'
          : 'Ativar tema escuro'
      "
    >
      <span class="theme-toggle__icon" aria-hidden="true">
        {{ theme() === 'dark' ? '☀' : '☾' }}
      </span>

      <span class="theme-toggle__label">
        {{ theme() === 'dark' ? 'Light Mode' : 'Dark Mode' }}
      </span>
    </button>

    <button
      class="header__notification"
      type="button"
      aria-label="Notificações"
      title="Notificações"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
        <path d="M10 21h4" />
      </svg>
      <span class="header__notification-dot"></span>
    </button>

    <div class="header__divider"></div>

    <button class="header__user" type="button" aria-label="Perfil do usuário">
      <span class="header__avatar">UD</span>

      <span class="header__user-info">
        <strong>Usuário Demo</strong>
        <small>Conta pessoal</small>
      </span>

      <svg class="header__chevron" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m7 10 5 5 5-5" />
      </svg>
    </button>
  </div>
</header>
