<app-page-header
  eyebrow="Visão geral"
  title="Dashboard"
  description="Acompanhe sua vida financeira em um só lugar."
></app-page-header>

<section class="stats-grid" aria-label="Resumo financeiro">
  @for (stat of stats; track stat.label) {
    <app-stat-card
      [label]="stat.label"
      [value]="stat.value"
      [description]="stat.description"
    ></app-stat-card>
  }
</section>

<section class="welcome-card">
  <span class="welcome-icon" aria-hidden="true">+</span>
  <div>
    <h2>Comece organizando suas finanças</h2>
    <p>As próximas features vão trazer contas, transações, metas e relatórios.</p>
  </div>
</section>
