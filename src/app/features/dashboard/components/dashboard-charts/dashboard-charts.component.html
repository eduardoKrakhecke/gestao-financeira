<section class="charts-grid">

  <article class="chart-card chart-card--monthly">
    <div class="chart-card__header">
      <div>
        <h2>Receitas x despesas</h2>
        <p>Comparativo dos últimos seis meses</p>
      </div>
    </div>

    <div class="chart-card__content">
      <canvas #monthlyChart></canvas>
    </div>
  </article>

  <article class="chart-card">
    <div class="chart-card__header">
      <div>
        <h2>Despesas por categoria</h2>
        <p>Distribuição dos gastos no mês</p>
      </div>
    </div>

    <div class="chart-card__content">
      <canvas #categoryChart></canvas>
    </div>
  </article>

  <article class="chart-card">
    <div class="chart-card__header">
      <div>
        <h2>Saldo por conta</h2>
        <p>Distribuição do saldo atual</p>
      </div>
    </div>

    <div class="chart-card__content">
      <canvas #accountChart></canvas>
    </div>
  </article>

</section>
